name: deepseek_chat
description: "万象 · 多模型聊天助手 —— 支持流式输出、图片理解、多会话历史与深色模式的客户端"
publish_to: 'none'

# 版本号：语义化版本 + 构建号
# 1.0.1：模型切换挪到聊天页顶栏；去掉重复的设置入口
# 1.1.0：新增发图片/文件、多会话（新建对话与历史列表）、设置收进菜单
# 1.1.1：思考过程与正文分离（可折叠）；⋮ 菜单改为「清空当前对话」
# 1.1.2：修复版本号显示成「开发版」（构建脚本读 pubspec 的方式失效）；空态文案精简
# 1.1.4：新增「关于」页（版本号移入其中，附创作者与开放平台链接）
# 1.1.5：支持重命名会话；创作者可跳 GitHub；修复流式输出卡顿
# 1.1.6：创作者优先打开 GitHub App，未安装则回退网页
version: 1.3.3+19
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------- 状态管理 ----------
  provider: ^6.1.2

  # ---------- 网络请求（流式 SSE 用 http.Client.send + StreamedResponse）----------
  http: ^1.2.2

  # ---------- 本地持久化（对话历史 + API Key + 主题）----------
  shared_preferences: ^2.3.2

  # ---------- 选图片 / 选文件 ----------
  image_picker: ^1.1.2
  # 注意：必须是 9 以上。8.x 自身是按 compileSdk 34 编译的，
  # 而 Flutter 3.47 要求 compileSdk >= 36，用 8.x 会在 Gradle 阶段直接失败。
  file_picker: ^13.1.0

  # ---------- 附件落盘到应用私有目录（避免把 base64 塞进 shared_preferences）----------
  path_provider: ^2.1.4

  # ---------- Assistant 气泡里的 Markdown / 代码块渲染 ----------
  flutter_markdown: ^0.7.4+1

  # ---------- 点击链接打开浏览器（开放平台 / 项目主页）----------
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
